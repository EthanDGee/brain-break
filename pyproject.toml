[project]
description = "An extension designed to curb doom-scrolling"
readme = "README.md"
authors = [{ name = "EthanDGee", email = "workethangee@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.143.0"]

[project.scripts]
brain-break = "brain_break:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
name = "brain-break"
version = "0.1.0"
